# AI File Agent — single-service compose setup.
# Prereq: cp .env.example .env and fill in a provider key.
# Plain `docker compose up -d --build` / `docker compose down` work as-is
# from this directory; the pinned project name keeps it isolated from any
# other compose projects on the same host.
name: file-agent
services:
  agent:
    build: .
    env_file:
      - .env
    # Host port comes from .env (PORT), defaulting to 8000. The container
    # always listens on 8000 internally (see Dockerfile CMD).
    ports:
      - "${PORT:-8000}:8000"
    # Bind-mount the workspaces so file state persists across restarts and is
    # inspectable/editable on the host. Keep them in sync with WORKSPACE_DIR /
    # WORKSPACE_ORIGINAL_DIR (the defaults ./workspace + ./workspace_original
    # resolve to /app/workspace and /app/workspace_original in the container).
    volumes:
      - ./workspace:/app/workspace
      - ./workspace_original:/app/workspace_original
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim has no curl; urllib is always available.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/files', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
