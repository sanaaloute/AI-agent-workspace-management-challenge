# AI File Agent — nginx server block (put in /etc/nginx/sites-available/agent,
# symlink into sites-enabled; see deploy/README.md).
#
# The rate-limit ZONE below cannot live in a server{} block — it must be
# declared once in the http{} context. Use the companion file:
#   deploy/nginx-http-snippet.conf  ->  /etc/nginx/conf.d/agent-limit.conf
# and keep the `limit_req` lines here as they are.

server {
    listen 80;
    listen [::]:80;

    # DNS A record for agent.barkosem.com must point at this VPS.
    server_name agent.barkosem.com;

    # File imports via the UI can be a few MB; 25m is generous but bounded.
    client_max_body_size 25m;

    # --- TLS (recommended): let certbot manage these lines ---------------
    # After `sudo certbot --nginx -d agent.barkosem.com`, certbot rewrites this
    # block to listen on 443 and adds an HTTP->HTTPS redirect. Equivalent
    # manual form:
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/agent.barkosem.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/agent.barkosem.com/privkey.pem;

    # --- API endpoints ----------------------------------------------------
    # /api/run returns immediately (202 + session_id) and the UI polls
    # /api/trace once a second, so no single request is long-lived; the
    # generous timeouts below are just headroom for slow networks.
    location /api/ {
        limit_req zone=agent_api burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # --- UI + static files -------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
