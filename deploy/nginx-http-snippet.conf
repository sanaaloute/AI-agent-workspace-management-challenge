# AI File Agent — http{} context snippet.
# limit_req_zone must be declared at the http level, NOT inside a server{}
# block. On Debian/Ubuntu nginx, /etc/nginx/conf.d/*.conf is included from
# the http{} block of /etc/nginx/nginx.conf, so drop this file there:
#
#   sudo cp deploy/nginx-http-snippet.conf /etc/nginx/conf.d/agent-limit.conf
#
# 10 MB of state (~160k IPs), 5 requests/second sustained per client IP;
# the server block (deploy/nginx.conf) applies it to /api/ with a burst of 10.
# The UI polls /api/trace once per second during a run, so 5 r/s leaves
# comfortable headroom for one user while still blocking abuse.

limit_req_zone $binary_remote_addr zone=agent_api:10m rate=5r/s;
